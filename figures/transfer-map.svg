<text x="690" y="770" fill="#61d6a3" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="750" text-anchor="start">PASSING, PREDECLARED GATE</text>
<text x="690" y="802" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">opens a new ADR; it never rewrites the source history</text>
