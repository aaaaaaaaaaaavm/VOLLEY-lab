<text x="104" y="552" fill="#9b8cff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="750" text-anchor="start">BOLLEY</text>
<text x="104" y="598" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="650" text-anchor="start">Integration-first</text>
<text x="104" y="636" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="start">spacecraft joins the machine</text>
<rect x="650" y="300" width="850" height="300" rx="18" fill="#0c1d2a" stroke="#ffb454"/>
<text x="690" y="346" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="750" text-anchor="start">VOLLEY-LAB</text>
<text x="690" y="392" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="650" text-anchor="start">No inherited evidence</text>
<text x="690" y="430" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="start">hypothesis · stop condition · revival gate</text>
