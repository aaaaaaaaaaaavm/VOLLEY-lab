<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="white"/>
<text x="40" y="48" fill="#17212b" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="600" text-anchor="start">Reassessment of a historical concept</text>
<line x1="55" y1="155" x2="1140" y2="155" stroke="#d8dcdf"/>
<text x="55" y="130" fill="#0072b2" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">1</text>
<text x="105" y="130" fill="#17212b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">Historical concept</text>
<text x="505" y="130" fill="#4d5964" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Retain original configuration and findings</text>
<line x1="55" y1="265" x2="1140" y2="265" stroke="#d8dcdf"/>
<text x="55" y="240" fill="#0072b2" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">2</text>
<text x="105" y="240" fill="#17212b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">Changed constraint</text>
<text x="505" y="240" fill="#4d5964" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Identify new source, limit or requirement</text>
<line x1="55" y1="375" x2="1140" y2="375" stroke="#d8dcdf"/>
<text x="55" y="350" fill="#0072b2" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">3</text>
<text x="105" y="350" fill="#17212b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">Independent assessment</text>
<text x="505" y="350" fill="#4d5964" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Recompute geometry, loads, mass and faults</text>
<line x1="55" y1="485" x2="1140" y2="485" stroke="#d8dcdf"/>
<text x="55" y="460" fill="#0072b2" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">4</text>
<text x="105" y="460" fill="#17212b" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="600" text-anchor="start">Decision</text>
<text x="505" y="460" fill="#4d5964" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" text-anchor="start">Accept, redesign or reject on current evidence</text>
<text x="40" y="570" fill="#4d5964" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" text-anchor="start">Conceptual decision process; no transferred hardware validation.</text>
</svg>
