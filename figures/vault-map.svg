<text x="592" y="612" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">PII-19</text>
<text x="678" y="612" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">INDUCTION DRIVE</text>
<text x="592" y="654" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">optimised the 11% term</text>
<text x="592" y="684" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" text-anchor="start">COMPUTED / ARGUED · NOT TESTED</text>
