<text x="1092" y="436" fill="#ff6b6b" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">PII-14</text>
<text x="1178" y="436" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">CABLE GONDOLA</text>
<text x="1092" y="478" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">inertia erased the headline gain</text>
<text x="1092" y="508" fill="#ff6b6b" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" text-anchor="start">COMPUTED / ARGUED · NOT TESTED</text>
