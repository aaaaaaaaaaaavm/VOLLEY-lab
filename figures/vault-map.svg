<text x="1092" y="612" fill="#ff6b6b" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">PII-21</text>
<text x="1178" y="612" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">WATER / STEAM</text>
<text x="1092" y="654" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">tube heat costs more than fluid saves</text>
<text x="1092" y="684" fill="#ff6b6b" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" text-anchor="start">COMPUTED / ARGUED · NOT TESTED</text>
<rect x="566" y="762" width="958" height="70" rx="18" fill="#091720" stroke="#21465b"/>
<text x="594" y="804" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="550" text-anchor="start">A stop can be reopened when its constraint moves. It is not scripture either.</text>
<text x="1494" y="870" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="650" text-anchor="end">6 LONG-FORM ENTRIES · 0 PHYSICAL OBSERVATIONS</text>
