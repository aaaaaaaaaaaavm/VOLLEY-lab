<text x="678" y="260" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">FREE-FLYER</text>
<text x="592" y="302" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">route back: standards + gas ceiling</text>
<text x="592" y="332" fill="#61d6a3" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" text-anchor="start">COMPUTED / ARGUED · NOT TESTED</text>
