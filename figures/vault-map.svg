<text x="1092" y="260" fill="#9b8cff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700" text-anchor="start">PII-9</text>
<text x="1178" y="260" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">LUNAR MASS DRIVER</text>
<text x="1092" y="302" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="400" text-anchor="start">different programme; no host</text>
<text x="1092" y="332" fill="#9b8cff" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="650" text-anchor="start">COMPUTED / ARGUED · NOT TESTED</text>
