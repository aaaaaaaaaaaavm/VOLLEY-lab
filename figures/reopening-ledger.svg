<rect x="72" y="708" width="1452" height="58" rx="12" fill="#091720" stroke="#21465b"/>
<text x="100" y="744" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">A route back is permission to ask the next question. It is not promotion and it is not test evidence.</text>
