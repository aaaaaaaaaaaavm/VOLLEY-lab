<text x="72" y="124" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="600" text-anchor="start">A stopped branch changes only when the constraint that stopped it changes.</text>
<text x="72" y="162" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="start">Verdicts are extracted from the six long-form vault entries and the current README review.</text>
