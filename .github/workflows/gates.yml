name: gates

on:
  push:
  pull_request:

jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PDF audience inspection dependency
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Prepublication file gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            python3 tools/prepublish_gate.py --all
          else
            git fetch -q origin "$BASE_SHA"
            python3 tools/prepublish_gate.py --base "$BASE_SHA"
          fi
      - name: Install captured numerical-check dependencies
        run: python3 -m pip install -r experiments/higher-speed-envelope/requirements-python.txt
      - name: Complete vault evidence entry point
        run: python3 tools/check_repo.py
